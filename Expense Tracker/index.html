<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker
    </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="mainContainer">
        <h1>Expense Tracker</h1>

        <div id="budgetControls">
            <input type="number" placeholder="Total Budget" id="totalBudgetInput" min="0">
            <button id="totalBudgetBtn">Add</button>
            <div id="budgetInfo"></div>
        </div>


        <div id="addExpenses">
            <input type="text" placeholder="Expense Name" id="expenseName">

            <input type="number" placeholder="Amount" id="expenseAmnt">

            <select id="expenseCategory">
                <option value="">Category</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Bills">Bills</option>
                <option value="Shopping">Shopping</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>

            <button id="addExpense">
                Add Expense
            </button>
        </div>

        <div id="expenseSummary"></div>


    </div>

    <script src="script.js"></script>
</body>

</html>
